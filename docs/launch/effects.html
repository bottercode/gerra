<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "SFMono"; src: local("SF Mono"), url("file:///System/Library/Fonts/SFNSMono.ttf"); }
  html, body { margin: 0; background: #0a0a0a; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0a;
           font-family: "SFMono", Menlo, monospace; color: #e5e5e5; }
  .abs { position: absolute; white-space: pre; }
  .c { left: 0; width: 1920px; text-align: center; }
  .panel { position: absolute; border: 3px solid #404040; border-radius: 28px; box-sizing: border-box; padding: 34px 40px; }
  .label { font-size: 30px; color: #737373; margin-bottom: 18px; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const RED = "#ef4444", GREEN = "#22c55e", TEXT = "#e5e5e5", DIM = "#737373", EDGE = "#404040";
const clamp = (v) => Math.max(0, Math.min(1, v));
const ease = (v) => 1 - Math.pow(1 - clamp(v), 3);
const inOut = (v) => { const x = clamp(v); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const mix = (a, b, k) => a + (b - a) * k;
const hex = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
const mixColor = (a, b, k) => { const x = hex(a), y = hex(b); return `rgb(${x.map((v, i) => Math.round(mix(v, y[i], k))).join(",")})`; };
const band = (t, a, b, f = 0.35) => Math.min(ease((t - a) / f), 1 - ease((t - (b - f)) / f));
const rise = (t, a) => (1 - ease((t - a) / 0.45)) * 22;
// Effects: same answer, missing webhook. 13 s loop.
function headline(t, lines, settleAt) {
  const settle = inOut((t - settleAt) / 0.7);
  const top = mix(470, 90, settle), size = mix(76, 54, settle);
  return lines.map((l) => {
    const o = band(t, l.a, l.b);
    if (o <= 0) return "";
    return `<div class="abs c" style="top:${top}px;font-size:${size}px;opacity:${o};transform:translateY(${rise(t, l.a)}px);color:${l.color || TEXT}">${l.text}</div>`;
  }).join("");
}
function panel(x, y, w, h, label, body, a, edge) {
  return `<div class="panel" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;opacity:${a};transform:scale(${mix(0.96, 1, a)});border-color:${edge}">` +
    `<div class="label">${label}</div>${body}</div>`;
}
function render(t) {
  const fadeAll = 1 - ease((t - 12.5) / 0.4);
  let h = headline(t, [
    { a: 0.15, b: 2.6, text: "Claude rewrote our backend." },
    { a: 2.5, b: 5.2, text: "Every response matched.", color: GREEN },
    { a: 5.1, b: 9.3, text: "It still forgot to send the webhook.", color: RED },
  ], 1.5);

  const out = 1 - ease((t - 9.2) / 0.45);
  const resA = ease((t - 1.8) / 0.45) * out;
  const ok = ease((t - 2.9) / 0.4);
  const resEdge = mixColor(EDGE, GREEN, ok);
  const json = `<div style="font-size:38px;line-height:1.5">200  {"id": 2, "done": true}</div>`;
  if (resA > 0) {
    h += panel(150, 220, 790, 190, "Python original · response", json, resA, resEdge);
    h += panel(980, 220, 790, 190, "Claude's rewrite · response", json, ease((t - 2.1) / 0.45) * out, resEdge);
    h += `<div class="abs c" style="top:440px;font-size:40px;color:${GREEN};opacity:${ok * out}">✓ identical</div>`;
  }
  const effA = ease((t - 5.2) / 0.45) * out;
  if (effA > 0) {
    const miss = ease((t - 6.1) / 0.4);
    const hook = `<div style="font-size:36px;line-height:1.55">POST hooks.acme.dev → 202<br><span style="color:${DIM}">{"event": "todo.completed"}</span></div>`;
    const none = `<div style="font-size:36px;line-height:1.5;color:${mixColor(DIM, RED, miss)}">(nothing sent)</div>`;
    h += panel(150, 560, 790, 230, "side effects", hook, effA, EDGE);
    h += panel(980, 560, 790, 230, "side effects", none, ease((t - 5.5) / 0.45) * out, mixColor(EDGE, RED, miss));
    h += `<div class="abs c" style="top:830px;font-size:40px;color:${RED};opacity:${ease((t - 6.6) / 0.4) * out}">✗ PATCH /todos/:id   effects $[0]   webhook missing</div>`;
  }
  const cta = ease((t - 9.6) / 0.5);
  if (cta > 0) {
    h += `<div class="abs c" style="top:400px;font-size:54px;opacity:${cta};transform:translateY(${(1 - cta) * 24}px)"><span style="color:${DIM}">$ </span>node --import @gerra/sdk-node/register server.js</div>`;
    h += `<div class="abs c" style="top:540px;font-size:46px;color:${DIM};opacity:${ease((t - 10.0) / 0.5)}">gerra checks what your service did, not just what it said.</div>`;
  }
  document.getElementById("stage").innerHTML = `<div style="opacity:${fadeAll}">${h}</div>`;
}
window.render = render;
render(0);
</script>
</body>
</html>
